[package]
name = "btop-egui"
version = "0.1.0"
edition = "2021"
description = "BTOP / HTOP style System Monitor built in Rust and egui with Source Han Sans typography & SVG icons"

[dependencies]
eframe = "0.28"
egui = "0.28"
egui_extras = { version = "0.28", features = ["svg", "image"] }
egui_plot = "0.28"
sysinfo = "0.30"
nvml-wrapper = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
chrono = "0.4"
parking_lot = "0.12"
rayon = "1.10"
